name: Skill CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structural-and-isolated-tests:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          # Windows 目前只作观察性运行：Skill 声称支持 Windows，但多数隔离测试
          # 是 POSIX 优先编写的，在 Windows 测试缺口补齐前不作为发布门禁。
          - os: windows-2022
            experimental: true
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate Skill structure and isolated behavior
        run: python scripts/validate_skill.py .
      - name: Run all isolated regression tests
        run: python -m unittest discover -s scripts -p "test_*.py"
